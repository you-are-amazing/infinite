<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Life Calendar - Track Your Year Progress</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Life Calendar - Visualize your year, month, and week progress with beautiful calendar views. Track daily achievements and yearly goals in one place.">
  <meta name="keywords" content="calendar tracker, life calendar, year progress, time tracker, productivity calendar, weekly tracker, monthly goals, visual progress">
  <meta name="author" content="Darshan Parmar">
  <meta name="theme-color" content="#4f8cff">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Life Calendar - Track Your Year Progress">
  <meta property="og:description" content="Visualize your year, month, and week progress with beautiful calendar views.">
  <meta property="og:site_name" content="Infinite">
  
  <link rel="icon" href="deserve.png" type="image/png">
  <link rel="stylesheet" href="static/css/style.css?v=17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      </button>
    </div>
    <div class="sidebar-content">
      <a href="index.html" class="sidebar-link" title="Home" aria-label="Home">
        <i class="fa-solid fa-house"></i>
      </a>
      <a href="notepad/" class="sidebar-link" title="Notepad" aria-label="Notepad">
        <i class="fa-solid fa-book"></i>
      </a>
      <a href="team/" class="sidebar-link" title="Team" aria-label="Team">
        <i class="fa-solid fa-users"></i>
      </a>
      <div class="sidebar-bottom" style="margin-top: auto; display: flex; flex-direction: column; align-items: center; width: 100%;">
        <button class="sidebar-link" id="theme-toggle" title="Switch to light mode" aria-label="Switch to light mode" aria-pressed="true">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
    </div>
  </div>

  <main>
    <header class="site-header">
      <span>Life Calendar</span>
    </header>

    <section class="calendar-container">
      <h1>Life Calendar</h1>
      <p class="calendar-description">
        Each square represents one week of your life. Darker squares show weeks that have passed.
        <br>
        <strong id="weeks-lived">0</strong> weeks lived out of <strong id="total-weeks">0</strong> weeks in your expected lifespan.
      </p>

      <div class="calendar-controls">
        <label for="birthdate">Birth Date:</label>
        <input type="date" id="birthdate">
        <label for="lifespan">Expected Lifespan:</label>
        <input type="number" id="lifespan" min="1" max="120">
        <button id="update-calendar" class="small-btn">Update Calendar</button>
      </div>

      <div class="calendar-grid" id="calendar-grid"></div>

      <div class="calendar-stats">
        <div class="stat-item"><div class="stat-number" id="years-lived">0</div><div class="stat-label">Years Lived</div></div>
        <div class="stat-item"><div class="stat-number" id="years-remaining">0</div><div class="stat-label">Years Remaining</div></div>
        <div class="stat-item"><div class="stat-number" id="percentage-lived">0%</div><div class="stat-label">Life Completed</div></div>
      </div>
    </section>
  </main>

  <script>
    const birthdateInput = document.getElementById('birthdate');
    const lifespanInput = document.getElementById('lifespan');
    const savedBirthdate = localStorage.getItem('calendarBirthdate') || '1990-01-01';
    const savedLifespan = localStorage.getItem('calendarLifespan') || '80';
    birthdateInput.value = savedBirthdate;
    lifespanInput.value = savedLifespan;

    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      const toggle = document.getElementById('theme-toggle');
      toggle.setAttribute('aria-pressed', String(isDark));
      toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      toggle.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
      toggle.innerHTML = `<i class="fa-solid fa-${isDark ? 'sun' : 'moon'}"></i>`;
    }

    applyTheme(localStorage.getItem('theme') || 'dark');
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', nextTheme);
      applyTheme(nextTheme);
    });

    function initSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const main = document.querySelector('main');
      // Sidebar always starts collapsed on every load; it no longer remembers a previous state.
      document.getElementById('sidebar-toggle').addEventListener('click', () => {
        sidebar.classList.toggle('expanded');
        main.classList.toggle('expanded');
      });
    }

    function generateCalendar() {
      const birth = new Date(birthdateInput.value + 'T00:00:00');
      const lifespan = Number(lifespanInput.value);
      const now = new Date();
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      let livedWeeks = 0;

      for (let year = 0; year < lifespan; year++) {
        const yearStart = new Date(birth);
        yearStart.setFullYear(birth.getFullYear() + year);
        const yearEnd = new Date(birth);
        yearEnd.setFullYear(birth.getFullYear() + year + 1);
        const weeksInYear = Math.round((yearEnd - yearStart) / (1000 * 60 * 60 * 24 * 7));
        const yearRow = document.createElement('div');
        yearRow.className = 'calendar-year';

        for (let week = 0; week < weeksInYear; week++) {
          const weekStart = new Date(yearStart);
          weekStart.setDate(yearStart.getDate() + week * 7);
          const weekEnd = new Date(weekStart);
          weekEnd.setDate(weekStart.getDate() + 7);
          const weekElement = document.createElement('div');
          weekElement.className = 'calendar-week';
          if (weekEnd <= now) {
            weekElement.classList.add('lived');
            livedWeeks++;
          } else if (weekStart <= now && now < weekEnd) {
            weekElement.classList.add('current');
            livedWeeks++;
          } else {
            weekElement.classList.add('remaining');
          }
          yearRow.appendChild(weekElement);
        }
        grid.appendChild(yearRow);
      }

      const end = new Date(birth);
      end.setFullYear(birth.getFullYear() + lifespan);
      const totalWeeks = Math.round((end - birth) / (1000 * 60 * 60 * 24 * 7));
      const yearsLived = Math.min(lifespan, Math.floor(livedWeeks / 52.14));
      document.getElementById('weeks-lived').textContent = livedWeeks.toLocaleString();
      document.getElementById('total-weeks').textContent = totalWeeks.toLocaleString();
      document.getElementById('years-lived').textContent = yearsLived;
      document.getElementById('years-remaining').textContent = Math.max(0, lifespan - yearsLived);
      document.getElementById('percentage-lived').textContent = `${Math.min(100, (livedWeeks / totalWeeks * 100)).toFixed(1)}%`;
    }

    document.getElementById('update-calendar').addEventListener('click', () => {
      localStorage.setItem('calendarBirthdate', birthdateInput.value);
      localStorage.setItem('calendarLifespan', lifespanInput.value);
      generateCalendar();
    });
    initSidebar();
    generateCalendar();
  </script>
</body>
</html>
