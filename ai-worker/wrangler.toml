# ai-worker — Cloudflare Worker for Infinite AI.
# Deploy with:  cd ai-worker && npx wrangler deploy

name = "infinite-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Free plan limits are generous enough here (100k requests/day), so leave workers_dev on.
workers_dev = true

[vars]
# The Firebase Web API key. It is public (it ships in static/js/auth.js already); the Worker
# only needs it to verify a signed-in user with Google Identity Toolkit.
FIREBASE_API_KEY = "AIzaSyDeodSvLLTFPr0dqmddU0WeFvy0fIVpHd8"
# A free router model. If this one disappears the Worker falls back to the built-in list
# in src/index.js, so setting it is optional.
HF_MODEL = "Qwen/Qwen3-4B-Instruct-2507"
DAILY_LIMIT = "40"
ALLOWED_ORIGINS = "https://you-are-amazing.github.io,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501"

# HF_TOKEN is a secret, never a var:
#   npx wrangler secret put HF_TOKEN

[observability]
enabled = true